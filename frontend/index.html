<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKARI | 日本語AIチューター</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-kyoto">
    <div id="app">
        <aside id="sidebar">
            <div class="brand"><h1>灯り AKARI</h1></div>
            <button id="new-conv">新しい会話</button>
            <div id="conv-list"></div>
        </aside>
        <main>
            <header>
                <div id="conv-title">新しい会話</div>
                <button id="theme-toggle">テーマ切替</button>
            </header>
            <div id="chat-window">
                <div id="welcome" class="welcome">
                    <h2>こんにちは。灯りです。</h2>
                    <p>日本語を一緒に勉強しましょう。</p>
                </div>
                <div id="messages"></div>
            </div>
            <footer>
                <div class="input-container">
                    <textarea id="message-input" placeholder="日本語で入力してください..."></textarea>
                    <button id="send-btn">送信</button>
                </div>
            </footer>
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
